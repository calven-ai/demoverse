<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Demoverse weekly loop: your target list of real ICP accounts seeds the ledger, which feeds the deterministic engine; the engine emits grounded requests; a Claude Code agent fills the prose; the engine ingests, lints and reconciles it into Salesforce, Google Drive and Slack; external IDs flow back to the ledger.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a5"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f7fa; text-anchor: middle; }
      .h   { font-size: 13px; font-weight: 600; }
      .h2  { font-size: 12.5px; font-weight: 600; }
      .s   { font-size: 10.5px; opacity: .88; }
      .xs  { font-size: 9.5px; opacity: .7; font-style: italic; }
      .cap { fill: #8b98a5; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-anchor: start; }
      .note{ fill: #8b98a5; font-size: 10.5px; font-style: italic; }
      .flow{ stroke: #8b98a5; stroke-width: 1.6; fill: none; }
      .grp { stroke: #8b98a5; stroke-width: 1.2; stroke-dasharray: 5 5; fill: none; opacity: .55; }
    </style>
  </defs>

  <!-- target list (input) -->
  <rect x="20" y="14" width="150" height="84" rx="10" fill="#0f766e"/>
  <text x="95" y="42" class="h">your target list</text>
  <text x="95" y="62" class="s">real ICP accounts</text>
  <text x="95" y="84" class="xs">CSV — or synthetic banks</text>
  <line x1="95" y1="98" x2="95" y2="118" class="flow" marker-end="url(#arr)"/>

  <!-- ledger -->
  <rect x="20" y="120" width="150" height="110" rx="10" fill="#475569"/>
  <text x="95" y="152" class="h">state/world.json</text>
  <text x="95" y="172" class="s">versioned ledger</text>
  <text x="95" y="188" class="s">source of truth</text>
  <text x="95" y="210" class="xs">git history = audit trail</text>

  <!-- deterministic engine, forward pass -->
  <rect x="200" y="78" width="350" height="172" rx="12" class="grp"/>
  <text x="212" y="98" class="cap">DETERMINISTIC ENGINE · TYPESCRIPT</text>

  <rect x="215" y="120" width="150" height="110" rx="10" fill="#3b82f6"/>
  <text x="290" y="150" class="h">weekly advance</text>
  <text x="290" y="172" class="s">open new deals</text>
  <text x="290" y="188" class="s">progress stages</text>
  <text x="290" y="204" class="s">close finished cycles</text>

  <rect x="385" y="120" width="150" height="110" rx="10" fill="#3b82f6"/>
  <text x="460" y="150" class="h">grounded requests</text>
  <text x="460" y="176" class="s">exact facts only —</text>
  <text x="460" y="192" class="s">no prose</text>

  <!-- agent -->
  <rect x="585" y="100" width="190" height="150" rx="10" fill="#7c3aed"/>
  <text x="680" y="128" class="h">Claude Code agent</text>
  <text x="680" y="146" class="s">fills the prose</text>
  <text x="680" y="172" class="s">transcripts · emails</text>
  <text x="680" y="188" class="s">AE notes · Slack posts</text>
  <text x="680" y="204" class="s">win-loss interviews</text>
  <text x="680" y="230" class="xs">one subagent per deal</text>

  <!-- forward arrows -->
  <line x1="170" y1="175" x2="213" y2="175" class="flow" marker-end="url(#arr)"/>
  <line x1="365" y1="175" x2="383" y2="175" class="flow" marker-end="url(#arr)"/>
  <line x1="535" y1="175" x2="583" y2="175" class="flow" marker-end="url(#arr)"/>
  <line x1="680" y1="250" x2="680" y2="315" class="flow" marker-end="url(#arr)"/>

  <!-- deterministic engine, return pass -->
  <rect x="570" y="288" width="220" height="180" rx="12" class="grp"/>
  <text x="582" y="306" class="cap">DETERMINISTIC ENGINE</text>

  <rect x="585" y="318" width="190" height="62" rx="10" fill="#3b82f6"/>
  <text x="680" y="342" class="h2">ingest + coherence lint</text>
  <text x="680" y="360" class="s">validate · same facts everywhere</text>

  <line x1="680" y1="380" x2="680" y2="402" class="flow" marker-end="url(#arr)"/>

  <rect x="585" y="404" width="190" height="54" rx="10" fill="#3b82f6"/>
  <text x="680" y="426" class="h2">reconcile</text>
  <text x="680" y="442" class="s">idempotent upserts</text>

  <!-- destinations -->
  <text x="940" y="284" class="note" style="text-anchor:end">only the curated ~50-deal cohort</text>

  <rect x="805" y="298" width="135" height="56" rx="10" fill="#475569"/>
  <text x="872" y="320" class="h2">Salesforce</text>
  <text x="872" y="338" class="s">CRM + timeline</text>

  <rect x="805" y="366" width="135" height="56" rx="10" fill="#475569"/>
  <text x="872" y="388" class="h2">Google Drive</text>
  <text x="872" y="406" class="s">transcripts · win-loss</text>

  <rect x="805" y="434" width="135" height="56" rx="10" fill="#475569"/>
  <text x="872" y="456" class="h2">Slack</text>
  <text x="872" y="474" class="s">deal chatter</text>

  <path d="M775 415 C 792 415, 790 326, 803 326" class="flow" marker-end="url(#arr)"/>
  <path d="M775 431 C 792 431, 790 394, 803 394" class="flow" marker-end="url(#arr)"/>
  <path d="M775 447 C 792 447, 790 462, 803 462" class="flow" marker-end="url(#arr)"/>

  <!-- return to ledger -->
  <path d="M630 458 L630 492 L95 492 L95 238" class="flow" marker-end="url(#arr)"/>
  <text x="400" y="486" class="note">external IDs recorded — re-runs update, never duplicate</text>
</svg>
