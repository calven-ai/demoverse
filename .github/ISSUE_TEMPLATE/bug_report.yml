name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands, relevant config (redact anything private), and output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node version & OS
      placeholder: node 20.11 / macOS 15
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I am not posting credentials, tokens, or private company data in this issue
          required: true
