name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Runs first: a credential in the diff matters more than a type error.
      - run: npm run secrets:check
      # No `cp config/templates/*.yaml config/` here on purpose: CI runs exactly
      # what a fresh clone runs. The suite loads the templates directly (see
      # tests/fixture.ts), so it must stay green with no operator config at all.
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run format:check
      - run: npm run lint:prose
      - run: npm test
