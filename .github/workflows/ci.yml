name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Tests run against the shipped templates as the active config.
      - run: cp config/templates/*.yaml config/
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run format:check
      - run: npm test
