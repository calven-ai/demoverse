# How the AE must (and must not) talk about the product. These shape the AE's
# OWN words on calls; the buyer still raises whatever competitor is on the
# deal naturally. 3–6 crisp rules; the two below about claims and competitors
# are worth keeping in some form for realism.
brand_guardrails:
  - "TODO: the core framing rule for how the product IS positioned (e.g. as a
    system/team you adopt, not another dashboard)."
  - "TODO: the anti-framing rule for what the AE never calls it (e.g. not an
    'all-in-one platform', not a 'chatbot')."
  - Don't claim specific metrics (hours saved, ROI %, cost cuts) unless the
    fictional company would plausibly have validated customer numbers. Use
    outcome claims instead.
  - The AE doesn't name competitors unprompted. When the BUYER raises the
    competitor on the deal, handle it on the merits.
