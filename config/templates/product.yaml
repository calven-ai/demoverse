# =============================================================================
# product.yaml
# Product grounding for SALES-CALL TRANSCRIPTS.
#
# WHAT THIS FILE CONTROLS
#   This is the durable messaging document the transcript builder injects into
#   EVERY call-transcript prompt, so the fictional AE can position the product,
#   run a believable demo, and map the right module to the buyer's pain. The
#   better this file, the better every transcript in the world sounds. It is
#   the single most important piece of prose authoring in the whole config.
#
# HOW TO FILL IT IN (the /setup wizard walks you through this)
#   1. Copy to config/product.yaml and replace every YOUR-* / TODO entry.
#   2. Write it like a real internal messaging doc: specific, opinionated,
#      concrete. Vague copy here produces vague transcripts everywhere.
#   3. Keep `domains` aligned with world.yaml company.product_modules (one
#      domain per module is the simplest mapping), and keep the agent/feature
#      `name`s consistent with use-cases.yaml `agents`. The use-case picker
#      tells the AE which of these to demo on each deal.
#
# LEAK-SAFETY / GUARDRAILS
#   • This is RAW INPUT, what a salesperson says on a call. Never paste in the
#     kind of derived analytics your downstream demo tool is supposed to
#     produce (competitor databases, persona docs, trend reports); the demo
#     payoff is that those get derived live from the raw world.
#   • Describe a FICTIONAL product from a FICTIONAL company. Don't reuse a real
#     vendor's copyrighted messaging.
# =============================================================================

positioning:
  # TODO: one sentence a rep could actually say. Name who it's for, what it
  # does, and the outcome. Pattern: "<COMPANY> is the <category> for <audience>
  # that <core value>, so <buyer> can <outcome>."
  one_liner: >-
    YOUR-COMPANY is the [category] platform for [target audience] that
    [core value proposition], so [buyer role] can [outcome] instead of
    [painful status quo].
  # TODO: how the rep frames the category and the honest competitive
  # comparison. Good pattern: "the real comparison is X, not vendor Y."
  category: >-
    TODO: Describe the category story. Say what the product is a member of or
    a replacement for, and what the honest comparison is ("YOUR-COMPANY vs. the
    fragmented stack of tools you run manually", not "vs. one competitor").
  # TODO: the product's connective tissue / platform concept, if it has one.
  # This is the thing the demo keeps coming back to (a shared workspace, a
  # knowledge graph, a data layer). If your product has no such concept,
  # describe the core workflow the modules share.
  universe: >-
    TODO: Describe the shared foundation your modules build on. Name the single
    source of truth, data model, or workflow that connects them, and say why it
    doesn't go stale or fall apart the way the status-quo alternative does.

