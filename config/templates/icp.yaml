# =============================================================================
# icp.yaml — the ICP fit scorecard
#
# WHAT THIS FILE CONTROLS
#   The weighted model the generator uses INTERNALLY to derive each account's
#   fit tier from its firmographics, then bias deal outcomes by it. In-ICP
#   accounts win more; the deliberately off-ICP slice is what makes any
#   downstream "in vs out of ICP" analytics meaningful.
#
#   LEAK-SAFETY: the engine generates ONLY the raw firmographics and NEVER
#   emits a fit score or tier — if your downstream demo tool computes ICP fit,
#   it should re-derive it live from the same raw fields. Mirroring your demo
#   tool's own scoring model here keeps the two coherent.
#
# HOW TO FILL IT IN (the /setup wizard walks you through this)
#   1. Copy to config/icp.yaml. Set each dimension's `levels` to score YOUR
#      ideal customer high: your priority industries at 1.0, your sweet-spot
#      size/bands at 1.0, and at least one deliberately off-ICP industry near
#      0 (that's the planted "looks out-of-ICP" story).
#   2. Every level key must match the vocabulary in world.yaml segments —
#      industries, sizes, band labels, tech_stack tools, trigger names. A key
#      the account doesn't match scores 0 for that dimension.
#   3. Dimension KEYS are fixed engine vocabulary — only these are scored:
#        industry, size, employee_band, revenue_band, funding_stage,
#        tech_stack, triggers
#      (an unknown key contributes weight but can never score — don't invent
#      new ones). Reweight and re-level freely.
#
# SCORING RULE (normalize-over-available): earned = Σ(weight ×
# level_fraction) over the dimensions; score = round(earned / Σweight × 100).
# `anyOf` dimensions take the single best-matching value. Tiers by threshold.
# =============================================================================

thresholds:
  tier1: 80          # score ≥ 80 → Tier 1 (core ICP)
  tier2: 58          # 58–79      → Tier 2 (expansion ICP); < 58 → Tier 3 (out-of-ICP)
  # Tuned so a realistic ~25–30% of pipeline lands out-of-ICP (Tier 3) — the
  # slice an ICP-analytics story exists to surface. Adjust after a dry-run if
  # your level values shift the distribution.

# In-ICP = Tier 1 or Tier 2; out-of-ICP = Tier 3.

dimensions:
  # TODO: keys must match world.yaml segments.industries. Score priority
  # verticals 1.0 and give the off-ICP slice ~0.1 so it reads as out-of-ICP
  # even when it later converts well (that mismatch is the "emerging segment"
  # story worth planting).
  industry:
    weight: 25
    match: exact
    levels:
      Software & SaaS: 1.0
      Financial Services: 0.9
      Retail & E-commerce: 0.8
      Professional Services: 0.7
      Manufacturing: 0.3
      Healthcare: 0.1          # the deliberate off-ICP slice

  # TODO: score your sweet-spot size 1.0.
  size:
    weight: 15
    match: exact
    levels:
      Mid-market: 1.0
      Enterprise: 0.8
      SMB: 0.3

  # Band labels are fixed engine vocabulary — reweight, don't rename.
  employee_band:
    weight: 5
    match: exact
    levels:
      "501-2000": 1.0
      "201-500": 0.8
      "2001-5000": 0.8
      "51-200": 0.3
      "5000+": 0.3
      "1-50": 0.0

  revenue_band:
    weight: 5
    match: exact
    levels:
      "$50-250M": 1.0
      "$10-50M": 0.8
      "$250M-1B": 0.7
      ">$1B": 0.4
      "<$10M": 0.3

  funding_stage:
    weight: 5
    match: exact
    levels:
      Series B: 1.0
      Series C: 1.0
      Series D+: 0.8
      Public: 0.6
      PE-owned: 0.5
      Series A: 0.4
      Seed: 0.2
      Bootstrapped: 0.1

  # anyOf: an account's tech_stack[] is scored at its single best-matching
  # tool. TODO: keys must match world.yaml segments.tech_stack; score the
  # tools that signal a good fit for YOUR product highest.
  tech_stack:
    weight: 10
    match: anyOf
    levels:
      Salesforce: 1.0
      HubSpot: 0.8
      Slack: 0.7
      Microsoft Dynamics: 0.5
      Snowflake: 0.5
      Tableau: 0.4

  # anyOf: active buying signals on the account (keys must match world.yaml
  # segments.triggers).
  triggers:
    weight: 15
    match: anyOf
    levels:
      Recent funding: 1.0
      Expansion: 0.8
      Exec hire: 0.8
      Tech migration: 0.7
      M&A: 0.6
      Restructuring: 0.4
